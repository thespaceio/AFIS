name: CI

on:
  push:
    branches: [main, "claude/**", "improve/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python: ["3.9", "3.11", "3.13"]
        include:
          - os: ubuntu-24.04
            python: "3.12"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest matplotlib
      - name: Run tests
        run: python -m pytest -q -rs
      - name: GUI smoke test
        run: python -m afis.gui --smoke-test

  clean-install:
    name: Clean install from wheel (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install into a fresh venv and run outside the source tree
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp
          export HOME=$(mktemp -d)
          /tmp/venv/bin/afis --version
          /tmp/venv/bin/afis demo
          DEMO=$(/tmp/venv/bin/python -c "from afis.demo import demo_dir; print(demo_dir())")
          /tmp/venv/bin/afis identify "$DEMO/demo-04_3.png"
          /tmp/venv/bin/afis verify demo-02 "$DEMO/demo-02_2.png"
          if /tmp/venv/bin/afis verify demo-02 "$DEMO/demo-05_2.png"; then echo "impostor accepted"; exit 1; fi
          /tmp/venv/bin/afis check
          /tmp/venv/bin/afis-gui --smoke-test
          test "$(stat -c %a $HOME/.local/share/afis/afis_templates.key)" = "600"
      - name: install.sh from source (fresh HOME)
        run: |
          export HOME=$(mktemp -d)
          ./install.sh
          $HOME/.local/bin/afis --version
          test -f $HOME/.local/share/applications/afis.desktop
          ./uninstall.sh
          test ! -e $HOME/.local/bin/afis
