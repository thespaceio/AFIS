[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afis"
version = "2.0.0"
description = "Automated Fingerprint Identification System: enhancement, minutiae extraction, matching and an encrypted template store, with a desktop GUI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Faith Alabi (SPACEIO)" }]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "scipy>=1.10",
  "scikit-image>=0.21",
  "cryptography>=41",
  "matplotlib>=3.7",
  "PySide6-Essentials>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
afis = "afis.cli:main"
afis-gui = "afis.gui.app:main"

[tool.setuptools.packages.find]
include = ["afis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
